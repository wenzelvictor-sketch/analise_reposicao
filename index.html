                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.amber}}>{fmtNum(r.pedidoSimuladoD)}</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.amber}}>{fmtNum(r.reposicaoD)}</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color: r.saldoCC<0 ? T.red : T.green}}>{fmtNum(r.saldoCC)}</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.saldoCC<0 ? T.red : T.green}}>{fmtMoneyFull(r.valorSaldoCC)}</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color: r.saldoSC<0 ? T.red : T.green}}>{fmtNum(r.saldoSC)}</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.saldoSC<0 ? T.red : T.green}}>{fmtMoneyFull(r.valorSaldoSC)}</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color: r.saldoD<0 ? T.red : T.green}}>{fmtNum(r.saldoD)}</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.saldoD<0 ? T.red : T.green}}>{fmtMoneyFull(r.valorSaldoD)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {tableRows.length > 500 && <div style={{ padding:10, fontSize:11.5, color:T.textFaint, textAlign:'center' }}>Mostrando 500 de {tableRows.length} linhas — refine os filtros para ver mais.</div>}
          {tableRows.length === 0 && <div style={{ padding:20, fontSize:12.5, color:T.textFaint, textAlign:'center' }}>Sem dados para os filtros selecionados.</div>}
        </div>
      </Card>
    </div>
  );
}

/* ============================================================
   ABA: RISCO DE BAIXO GIRO (compra sem uso — puxada real / NRM)
   ============================================================ */
function GiroRiscoTab({ rows, totais, resumoPorEmpresa, empresasMap, materiaisMap, availableMonths, giroMesRef, setGiroMesRef, availableEmpresas, availableRegionais,
  giroEmpresas, setGiroEmpresas, giroRegionais, setGiroRegionais, giroSkuSearch, setGiroSkuSearch,
  weights, setWeights, threshold, setThreshold }) {

  const handleExport = () => {
    const data = rows.map(r => ({
      'Mês analisado': mesLabel(r.mes),
      'Empresa': empresasMap[r.ce] || r.ce,
      'Regional': r.dep,
      'SKU': r.mat,
      'Descrição': materiaisMap[r.mat] || '',
      'Reposição CC do mês (qtd)': r.rcc,
      'Valor Reposição CC (R$)': r.valorReposicao,
      'CMM3': r.cmm,
      'CMM12 (só para Giro)': r.cmm12,
      'Puxada do mês': r.qtdPuxada,
      'Ped. Aberto': r.pedidoOriginal,
      'Puxada / CMM': r.razaoPuxadaCmm,
      'Demanda_m1': r.dm1,
      'Demanda_m1 / CMM': r.razaoDm1Cmm,
      'Demanda_m2': r.dm2,
      'Demanda_m2 / CMM': r.razaoDm2Cmm,
      'Demanda_m3': r.dm3,
      'Demanda_m3 / CMM': r.razaoDm3Cmm,
      'Razão NRM histórica': r.razaoNrmHist,
      'CV Puxada histórica': r.cvPuxada,
      'Média histórica Reposição': r.mediaRepHist,
      'Meses de histórico usados': r.nMesesHist,
      'Saldo N1': r.n1,
      'Saldo N2': r.n2,
      'Saldo N3': r.n3,
      'Giro de Estoque': isFinite(r.giroEstoque) ? r.giroEstoque : null,
      'P1 Puxada>>CMM': r.riscoPuxada ? 'Sim' : 'Não',
      'P2a Demanda_m1>>CMM': r.riscoDm1 ? 'Sim' : 'Não',
      'P2b Demanda_m2>>CMM': r.riscoDm2 ? 'Sim' : 'Não',
      'P2c Demanda_m3>>CMM': r.riscoDm3 ? 'Sim' : 'Não',
      'P3 NRM histórico baixo': r.riscoNrmBaixo ? 'Sim' : 'Não',
      'P4 Puxada volátil (dente de serra)': r.riscoVolatilidade ? 'Sim' : 'Não',
      'P5 Reposição outlier vs histórico': r.riscoOutlierRep ? 'Sim' : 'Não',
      'P6 Giro de estoque baixo (<7,5)': r.riscoGiroBaixo ? 'Sim' : 'Não',
      'Score': r.score,
      'Risco de Baixo Giro': r.riscoGiro ? 'Sim' : 'Não',
      'Saldo N3 > 2×CMM3 (zera sugestão)': r.estoqueN3Suficiente ? 'Sim' : 'Não',
      'Sugestão de Compra (qtd)': r.sugestaoCompra,
      'Sugestão de Compra (R$)': r.valorSugestaoCompra,
      'Economia vs Reposição CC (qtd)': r.economiaSugestao,
      'Economia vs Reposição CC (R$)': r.valorEconomiaSugestao,
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Risco Baixo Giro');
    XLSX.writeFile(wb, `Risco_Baixo_Giro_${giroMesRef || ''}.xlsx`);
  };

  const pctRisco = totais.valorTotal > 0 ? (totais.valorRisco / totais.valorTotal) * 100 : 0;

  return (
    <div>
      <div style={{ display:'grid', gridTemplateColumns:'280px 1fr', gap:18, alignItems:'start' }}>
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          <Card style={{ padding:16 }}>
            <SectionLabel icon={Sliders}>Pesos do Score de Risco</SectionLabel>
            <div style={{ fontSize:11, color:T.textDim, lineHeight:1.5, marginBottom:12 }}>
              Analisa o mês selecionado (por padrão, o mais recente) e identifica SKUs cuja compra não parece justificada pelo consumo médio mais recente (CMM3) — sinal de risco de comprar em excesso. Exceção: o Giro de Estoque (P6) continua usando CMM12.
            </div>
            <WeightSlider label="Puxada do mês &gt;&gt; CMM3 (×1,5)" value={weights.w1} color={T.red} onChange={v => setWeights(w => ({ ...w, w1:v }))} />
            <WeightSlider label="Demanda_m1/m2/m3 &gt;&gt; CMM3 (×1,5)" value={weights.w2} color={T.amber} onChange={v => setWeights(w => ({ ...w, w2:v }))} />
            <WeightSlider label="NRM histórico baixo (&lt;20%)" value={weights.w3} color={T.amber} onChange={v => setWeights(w => ({ ...w, w3:v }))} />
            <WeightSlider label="Puxada histórica volátil (dente de serra)" value={weights.w4} color={T.red} onChange={v => setWeights(w => ({ ...w, w4:v }))} />
            <WeightSlider label="Reposição do mês é outlier (&gt;2× a média)" value={weights.w5} color={T.teal} onChange={v => setWeights(w => ({ ...w, w5:v }))} />
            <WeightSlider label="Giro de estoque baixo (&lt;7,5)" value={weights.w6} color={T.red} onChange={v => setWeights(w => ({ ...w, w6:v }))} />
            <div style={{ borderTop:`1px solid ${T.border}`, paddingTop:12, marginTop:4 }}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
                <span style={{ fontSize:12.5 }}>Limiar de risco (score ≥)</span>
                <span style={{ fontFamily:T.mono, fontSize:12.5, color:T.amber, fontWeight:700 }}>{threshold.toFixed(2)}</span>
              </div>
              <input type="range" min={0} max={1} step={0.05} value={threshold} onChange={e => setThreshold(parseFloat(e.target.value))} style={{ width:'100%', accentColor:T.amber }} />
            </div>
          </Card>

          <Card style={{ padding:16 }}>
            <SectionLabel>Filtros</SectionLabel>
            <div style={{ fontSize:11, color:T.textFaint, marginBottom:5, textTransform:'uppercase', letterSpacing:'0.06em' }}>Mês de referência</div>
            <select value={giroMesRef || ''} onChange={e => setGiroMesRef(e.target.value)}
              style={{ width:'100%', background:T.panel2, border:`1px solid ${T.border}`, borderRadius:6, color:T.text, fontFamily:T.mono, fontSize:12.5, padding:'7px 10px', marginBottom:12 }}>
              {availableMonths.map(m => <option key={m} value={m}>{mesLabel(m)}</option>)}
            </select>
            <MultiSelect label="Empresa" options={availableEmpresas} selected={giroEmpresas} onChange={setGiroEmpresas} placeholder="Todas as empresas" />
            <MultiSelect label="Regional" options={availableRegionais} selected={giroRegionais} onChange={setGiroRegionais} placeholder="Todas as regionais" />
            <div style={{ fontSize:11, color:T.textFaint, marginBottom:5, marginTop:10, textTransform:'uppercase', letterSpacing:'0.06em' }}>Buscar SKU (código ou descrição)</div>
            <input value={giroSkuSearch} onChange={e=>setGiroSkuSearch(e.target.value)} placeholder="ex: 90198 ou poste"
              style={{ width:'100%', boxSizing:'border-box', background:T.panel2, border:`1px solid ${T.border}`, borderRadius:6, color:T.text, fontFamily:T.sans, fontSize:12.5, padding:'7px 10px' }} />
          </Card>
        </div>

        <div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(190px, 1fr))', gap:12, marginBottom:18 }}>
            <StatChip label="SKUs de Risco" value={`${totais.nRisco}`} sub={`de ${totais.total} com compra em ${mesLabel(giroMesRef)}`} color={T.red} />
            <StatChip label="Valor em Risco" value={fmtMoney(totais.valorRisco)} sub={`${pctRisco.toFixed(1)}% da Reposição CC do mês`} color={T.amber} />
            <StatChip label="Reposição CC do Mês (filtrado)" value={fmtMoney(totais.valorTotal)} color={T.text} />
            <StatChip label="Sugestão de Compra (SKUs de risco)" value={fmtMoney(totais.valorSugestaoTotal)} color={T.teal} />
            <StatChip label="Economia Potencial" value={fmtMoney(totais.valorEconomiaTotal)} sub="Reposição CC − Sugestão, só linhas de risco" color={T.green} />
          </div>

          <Card style={{ padding:16, marginBottom:16 }}>
            <SectionLabel>Resumo por Empresa — {mesLabel(giroMesRef)}</SectionLabel>
            <div style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12.5 }}>
                <thead>
                  <tr style={{ borderBottom:`1px solid ${T.border}` }}>
                    <th style={thStyle}>Empresa</th>
                    <th style={{...thStyle, textAlign:'right'}}>CMM12 (R$)</th>
                    <th style={{...thStyle, textAlign:'right'}}>Demanda Total (R$)</th>
                    <th style={{...thStyle, textAlign:'right'}}>Saldo N3 (R$)</th>
                    <th style={{...thStyle, textAlign:'right'}}>Reposição CC (R$)</th>
                    <th style={{...thStyle, textAlign:'right'}}>Reposição c/ Sugestões (R$)</th>
                    <th style={{...thStyle, textAlign:'right'}}>Economia Projetada (R$)</th>
                    <th style={{...thStyle, textAlign:'right'}}>SKUs (risco/total)</th>
                  </tr>
                </thead>
                <tbody>
                  {resumoPorEmpresa.linhas.map((e,i) => (
                    <tr key={i} style={{ borderTop:`1px solid ${T.border}` }}>
                      <td style={tdStyle}>{empresasMap[e.ce] || e.ce}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{fmtMoneyFull(e.valorCmm12)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{fmtMoneyFull(e.valorDemandaTotal)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{fmtMoneyFull(e.valorSaldoN3)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700}}>{fmtMoneyFull(e.valorReposicaoCC)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.teal}}>{fmtMoneyFull(e.valorReposicaoSugerida)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: e.valorEconomiaProjetada>0?T.green:T.textFaint}}>{fmtMoneyFull(e.valorEconomiaProjetada)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{e.nRisco}/{e.nSkus}</td>
                    </tr>
                  ))}
                  {resumoPorEmpresa.linhas.length === 0 && (
                    <tr><td colSpan={8} style={{...tdStyle, textAlign:'center', color:T.textFaint, padding:20}}>Sem dados para os filtros selecionados.</td></tr>
                  )}
                  {resumoPorEmpresa.linhas.length > 0 && (
                    <tr style={{ borderTop:`2px solid ${T.borderLight}`, background:T.panel2 }}>
                      <td style={{...tdStyle, fontWeight:700}}>Total</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color:T.textDim}}>{fmtMoneyFull(resumoPorEmpresa.totais.valorCmm12)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color:T.textDim}}>{fmtMoneyFull(resumoPorEmpresa.totais.valorDemandaTotal)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color:T.textDim}}>{fmtMoneyFull(resumoPorEmpresa.totais.valorSaldoN3)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700}}>{fmtMoneyFull(resumoPorEmpresa.totais.valorReposicaoCC)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color:T.teal}}>{fmtMoneyFull(resumoPorEmpresa.totais.valorReposicaoSugerida)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color:T.green}}>{fmtMoneyFull(resumoPorEmpresa.totais.valorEconomiaProjetada)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color:T.textDim}}>{resumoPorEmpresa.totais.nRisco}/{resumoPorEmpresa.totais.nSkus}</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </Card>

          <Card style={{ padding:16 }}>
            <SectionLabel>SKUs Analisados — {mesLabel(giroMesRef)}</SectionLabel>
            <div style={{ display:'flex', justifyContent:'flex-end', marginBottom:10 }}>
              <button onClick={handleExport} disabled={rows.length===0} style={{
                display:'flex', alignItems:'center', gap:6, background:T.tealDim, border:`1px solid ${T.teal}`, borderRadius:6,
                padding:'8px 12px', color:T.teal, fontFamily:T.sans, fontSize:12, fontWeight:600, cursor: rows.length ? 'pointer':'not-allowed',
                opacity: rows.length ? 1 : 0.5
              }}>
                <Download size={13} /> Baixar Excel ({rows.length})
              </button>
            </div>
            <div style={{ maxHeight:600, overflow:'auto', border:`1px solid ${T.border}`, borderRadius:8 }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                <thead>
                  <tr style={{ position:'sticky', top:0, background:T.panel2, zIndex:1 }}>
                    <th style={thStyle}>Empresa</th>
                    <th style={thStyle}>Regional</th>
                    <th style={thStyle}>SKU</th>
                    <th style={{...thStyle, minWidth:160}}>Descrição</th>
                    <th style={{...thStyle, textAlign:'right'}}>Reposição CC (R$)</th>
                    <th style={{...thStyle, textAlign:'right'}}>CMM3</th>
                    <th style={{...thStyle, textAlign:'right'}}>Puxada do Mês</th>
                    <th style={{...thStyle, textAlign:'right'}}>Ped. Aberto</th>
                    <th style={{...thStyle, textAlign:'right'}}>Puxada/CMM</th>
                    <th style={{...thStyle, textAlign:'right'}}>Dm1/CMM</th>
                    <th style={{...thStyle, textAlign:'right'}}>Dm2/CMM</th>
                    <th style={{...thStyle, textAlign:'right'}}>Dm3/CMM</th>
                    <th style={{...thStyle, textAlign:'right'}}>%NRM hist.</th>
                    <th style={{...thStyle, textAlign:'right'}}>CV Puxada</th>
                    <th style={{...thStyle, textAlign:'right'}}>Saldo N3</th>
                    <th style={{...thStyle, textAlign:'right'}}>Giro</th>
                    <th style={{...thStyle, textAlign:'center'}}>P1</th>
                    <th style={{...thStyle, textAlign:'center'}}>P2</th>
                    <th style={{...thStyle, textAlign:'center'}}>P3</th>
                    <th style={{...thStyle, textAlign:'center'}}>P4</th>
                    <th style={{...thStyle, textAlign:'center'}}>P5</th>
                    <th style={{...thStyle, textAlign:'center'}}>P6</th>
                    <th style={{...thStyle, textAlign:'right'}}>Score</th>
                    <th style={{...thStyle, textAlign:'center'}}>Risco?</th>
                    <th style={{...thStyle, textAlign:'right'}}>Reposição CC (qtd)</th>
                    <th style={{...thStyle, textAlign:'right'}}>Sugestão de Compra (qtd)</th>
                    <th style={{...thStyle, textAlign:'right'}}>Economia (R$)</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.slice(0, 500).map((r,i) => (
                    <tr key={i} style={{ borderTop:`1px solid ${T.border}`, background: r.riscoGiro ? T.redDim+'22' : 'transparent' }}>
                      <td style={tdStyle}>{empresasMap[r.ce] || r.ce}</td>
                      <td style={{...tdStyle, fontFamily:T.mono, color:T.textDim}}>{r.dep}</td>
                      <td style={{...tdStyle, fontFamily:T.mono}}>{r.mat}</td>
                      <td style={{...tdStyle, color:T.textDim, maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{materiaisMap[r.mat] || '—'}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700}}>{fmtMoneyFull(r.valorReposicao)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{fmtNum(r.cmm,1)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoPuxada?T.red:T.textDim}}>{fmtNum(r.qtdPuxada)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{fmtNum(r.pedidoOriginal)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoPuxada?T.red:T.textDim}}>{isFinite(r.razaoPuxadaCmm) ? r.razaoPuxadaCmm.toFixed(1)+'×' : '∞'}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoDm1?T.amber:T.textDim}}>{isFinite(r.razaoDm1Cmm) ? r.razaoDm1Cmm.toFixed(1)+'×' : '∞'}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoDm2?T.amber:T.textDim}}>{isFinite(r.razaoDm2Cmm) ? r.razaoDm2Cmm.toFixed(1)+'×' : '∞'}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoDm3?T.amber:T.textDim}}>{isFinite(r.razaoDm3Cmm) ? r.razaoDm3Cmm.toFixed(1)+'×' : '∞'}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoNrmBaixo?T.amber:T.textDim}}>{(r.razaoNrmHist*100).toFixed(0)}%</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoVolatilidade?T.red:T.textDim}}>{r.cvPuxada.toFixed(2)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{fmtNum(r.n3)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoGiroBaixo?T.red:T.textDim}}>{isFinite(r.giroEstoque) ? r.giroEstoque.toFixed(1) : '∞'}</td>
                      <td style={{...tdStyle, textAlign:'center', color: r.riscoPuxada?T.red:T.textFaint}}>{r.riscoPuxada ? '✓' : '—'}</td>
                      <td style={{...tdStyle, textAlign:'center', color: r.riscoDemandaM3?T.amber:T.textFaint}}>{r.riscoDemandaM3 ? '✓' : '—'}</td>
                      <td style={{...tdStyle, textAlign:'center', color: r.riscoNrmBaixo?T.amber:T.textFaint}}>{r.riscoNrmBaixo ? '✓' : '—'}</td>
                      <td style={{...tdStyle, textAlign:'center', color: r.riscoVolatilidade?T.red:T.textFaint}}>{r.riscoVolatilidade ? '✓' : '—'}</td>
                      <td style={{...tdStyle, textAlign:'center', color: r.riscoOutlierRep?T.teal:T.textFaint}}>{r.riscoOutlierRep ? '✓' : '—'}</td>
                      <td style={{...tdStyle, textAlign:'center', color: r.riscoGiroBaixo?T.red:T.textFaint}}>{r.riscoGiroBaixo ? '✓' : '—'}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700}}>{r.score.toFixed(2)}</td>
                      <td style={{...tdStyle, textAlign:'center', fontWeight:700, color: r.riscoGiro?T.red:T.textFaint}}>{r.riscoGiro ? 'Sim' : 'Não'}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{fmtNum(r.rcc)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoGiro?(r.estoqueN3Suficiente?T.green:T.teal):T.textFaint, fontWeight: r.riscoGiro?700:400}} title={r.riscoGiro && r.estoqueN3Suficiente ? 'Saldo N3 já cobre 2×CMM3 — nenhuma compra sugerida' : undefined}>{r.riscoGiro ? fmtNum(r.sugestaoCompra) : '—'}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color: r.riscoGiro && r.valorEconomiaSugestao>0 ?T.green:T.textFaint}}>{r.riscoGiro ? fmtMoneyFull(r.valorEconomiaSugestao) : '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {rows.length > 500 && <div style={{ padding:10, fontSize:11.5, color:T.textFaint, textAlign:'center' }}>Mostrando 500 de {rows.length} linhas — refine os filtros para ver mais.</div>}
              {rows.length === 0 && <div style={{ padding:20, fontSize:12.5, color:T.textFaint, textAlign:'center' }}>Sem dados para os filtros selecionados.</div>}
            </div>
            <div style={{ fontSize:10.5, color:T.textFaint, marginTop:10, lineHeight:1.5 }}>
              P1 Puxada≫CMM3 · P2 Demanda_m1, m2 ou m3≫CMM3 (cada demanda é avaliada nos 3 meses em que passa pelo pipeline) · P3 NRM histórico baixo · P4 Puxada volátil (dente de serra) · P5 Reposição do mês é outlier frente à própria média histórica do SKU · P6 Giro de estoque abaixo de 7,5 (Giro = 12/Cobertura, Cobertura = (SaldoN1+SaldoN2+SaldoN3)/CMM12 — exceção que usa CMM12, não CMM3).<br/>
              <b>Sugestão de Compra</b> (só para linhas de risco) = MÍN(Reposição CC, MÁX(0, 2×CMM3 − Disponível)), onde Disponível = MÁX(0, Ped.Aberto−Puxada) — alveja 2 meses de cobertura com base no consumo mais recente, garantindo saldo residual para os clientes puxarem, em vez de seguir a Demanda_Total (que pode estar inflada). Nunca ultrapassa a Reposição CC original — a sugestão só reduz a compra, nunca aumenta. Para SKUs com giro abaixo de 7,5 (P6, que usa CMM12), o SaldoN3 (estoque já em casa) é SOMADO ao Disponível: Disponível = MÁX(0, Ped.Aberto−Puxada) + SaldoN3. Se o SaldoN3 sozinho já for maior que 2×CMM3, a sugestão vira 0 — já existe estoque em casa suficiente, mostrado em verde na tabela.
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
