// EMG e EMR sao a mesma empresa: sempre exibir como EMR
function aplicarAliasEmpresa(mapaEmpresas) {
  const out = {};
  for (const [k,v] of Object.entries(mapaEmpresas)) out[k] = (v === 'EMG') ? 'EMR' : v;

function normHeader(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}

// candidatos de cabecalho aceitos para cada campo (cobre reposicoes.xlsx e Visao Geral)
const HEADER_MAP = {
  ce:  ['codigo empresa'],
  dep: ['deposito'],
  mat: ['codigo material'],
  desc:['descricao_do_material','descricao do material','descricao'],
  pu:  ['preco unitario'],
  es:  ['estoque seguranca (qtd)','estoque seguranca'],
  n1:  ['saldo n1'],

};

function buildHeaderIndex(headerRow) {
  const idx = {};
  const normed = headerRow.map(normHeader);
  for (const [field, candidates] of Object.entries(HEADER_MAP)) {
    let found = -1;
    for (const cand of candidates) {
      const p = normed.indexOf(cand);
      if (p !== -1) { found = p; break; }
    }
    idx[field] = found;
  }
  return idx;
}

/* ============================================================
   DE-PARA DE REGIONAIS (agrupamento de depósitos)
   Sempre que Empresa+Regional bater com "de", substitui por "para".
   Aplica-se tanto aos dados históricos embutidos quanto a qualquer mês novo enviado.
   ============================================================ */
const DEPARA_REGIONAL = [
  { ce: 27,  de: 1,  para: 0 },  // EPB
  { ce: 20,  de: 1,  para: 0 },  // ESE
  { ce: 193, de: 6,  para: 1 },  // EMS

  { ce: 193, de: 34, para: 7 },  // EMS
];
const DEPARA_MAP = new Map(DEPARA_REGIONAL.map(d => [`${d.ce}|${d.de}`, d.para]));
function aplicarDeParaRegional(ce, dep) {
  const alvo = DEPARA_MAP.get(`${ce}|${dep}`);
  return alvo !== undefined ? alvo : dep;
}

// Consolida (soma) linhas que passaram a compartilhar a mesma chave Mes+Empresa+Regional+Material
// apos o DE-PARA (ex.: duas regionais antigas que viraram uma so).
function consolidarLinhasDuplicadas(rows) {
  const SUM_FIELDS = ['es','n1','n2','n3','dt','dm0','dm1','dm2','dm3','c3','c6','c12','ca','rcc'];
  const sumIdx = SUM_FIELDS.map(f => CI[f]).filter(i => i !== undefined);
  const groups = new Map();
  for (const row of rows) {
    const key = `${row[CI.mes]}|${row[CI.ce]}|${row[CI.dep]}|${row[CI.mat]}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  }
  const out = [];
  for (const [, group] of groups) {
    if (group.length === 1) { out.push(group[0]); continue; }
    const merged = [...group[0]];
    for (const idx of sumIdx) merged[idx] = group.reduce((s,r) => s + r[idx], 0);
    merged[CI.pu] = group.reduce((s,r) => s + r[CI.pu], 0) / group.length;
    out.push(merged);
  }
  return out;
}

  const idx = buildHeaderIndex(header);
  const required = ['ce','dep','mat','pu','es','n1','n2','dt','dm0','dm3','c3','c6','c12','ca','rcc'];
  const optional = ['n3','dm1','dm2','desc'];
  const missing = required.filter(f => idx[f] === -1);
  if (missing.length) {
    throw new Error('Colunas não encontradas no arquivo: ' + missing.join(', '));
  }
  const newRows = [];
  const newMateriais = {};
  for (let i = 1; i < rows2d.length; i++) {
    const r = rows2d[i];
    if (!r || r[idx.ce] === undefined || r[idx.ce] === '' || r[idx.mat] === undefined) continue;
    const row = COLS.map(c => {
      if (c === 'mes') return mes;
      if (c === 'pxr') return -1; // sem dado real de carta neste upload -> usa formula derivada
      if (c === 'nrm') return 0; // sem dado de NRM neste upload -> demanda nao ajustada
      if (c === 'pxc') return 0; // sem dado de puxada real neste upload -> usado so na analise de giro
      const v = r[idx[c]];
      return typeof v === 'number' ? v : parseFloat(v) || 0;
    });
    row[CI.dep] = aplicarDeParaRegional(row[CI.ce], row[CI.dep]);
    newRows.push(row);
    if (idx.desc !== -1) {
      const matCode = row[CI.mat];
      if (r[idx.desc]) newMateriais[matCode] = r[idx.desc];
    }
  }
  return { rows: consolidarLinhasDuplicadas(newRows), materiais: newMateriais };
}

const MONTH_LABELS = {
  '01':'Jan','02':'Fev','03':'Mar','04':'Abr','05':'Mai','06':'Jun',
  '07':'Jul','08':'Ago','09':'Set','10':'Out','11':'Nov','12':'Dez'
};
function mesLabel(mes) {
  if (!mes) return '';
  const [y,m] = mes.split('-');
  return `${MONTH_LABELS[m]}/${y.slice(2)}`;
}

function fmtMoney(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  const abs = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  if (abs >= 1e6) return `${sign}R$ ${(abs/1e6).toFixed(2)}mi`;
  if (abs >= 1e3) return `${sign}R$ ${(abs/1e3).toFixed(1)}mil`;
  return `${sign}R$ ${abs.toFixed(0)}`;
}
function fmtMoneyFull(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
}
function fmtNum(v, dec=0) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return v.toLocaleString('pt-BR', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}

/* ============================================================
   MOTOR DE CÁLCULO (espelha a metodologia Python)
   ============================================================ */
function computeDerived(rawRows, weights, threshold) {
  const { w1, w2, w3 } = weights;
  return rawRows.map(row => {
    const [mes, ce, dep, mat, pu, es, n1, n2, n3, dt, dm0, dm1, dm2, dm3, c3, c6, c12, ca, rcc, pxr, nrm, pxc] = row;
    const cmm3teto = Math.max(0, c3);
    const reposicaoSC = Math.max(0, es + dt - (n1 + n2 + ca));
    // Formula correta (algebrica direta, sem duplo truncamento em 0):
    // qtd_carta = Reposicao_CC - Estoque_seguranca - Demanda_total + Saldo N1 + Saldo N2 + Compras em Aberto
    const qtdPuxadaDerivada = Math.max(0, rcc - es - dt + n1 + n2 + ca);
    // NOVA SIMULACAO: Reposicao_CC recalculada descontando NRM (material ja entregue) da Demanda Total
    const nrmVal = nrm || 0;
    const demandaAjustadaNRM = Math.max(0, dt - nrmVal);
    // Puxada REAL (cartas.xlsx) tem prioridade sobre a derivada, quando disponivel (pxr >= 0; -1 = sem dado real)
    const qtdPuxada = (pxr !== undefined && pxr >= 0) ? pxr : qtdPuxadaDerivada;
    const risco1 = dm0 > cmm3teto * 1.10;
    const risco2 = qtdPuxada > dm0;
    const risco3 = qtdPuxada > cmm3teto * 1.10;
    const score = (risco1 ? w1 : 0) + (risco2 ? w2 : 0) + (risco3 ? w3 : 0);
    // Score=0 nunca conta como risco (mesmo com limiar=0) - garante que zerar pesos e limiar reproduz o comportamento da Reposicao_CC
    const riscoGeral = score > 1e-9 && score >= threshold - 1e-9;
    const reposicaoSCRisco = riscoGeral ? reposicaoSC : rcc;
    const pedidosAbertoOriginal = ca;
    const cartaTermoRisco = riscoGeral ? 0 : qtdPuxada;
    const pedidosAbertoRecalc = ca - cartaTermoRisco;
    // Saldo/Ruptura CC (original) do proprio mes, usando o dado real de Compras em Aberto - sem rollforward
    const saldoCC = ca - qtdPuxada;
    // Reposicao_CC ajustada por NRM: mesma formula do CC original, com Demanda Total substituida pela ajustada
    const reposicaoCCNRM = Math.max(0, es + demandaAjustadaNRM - (n1 + n2 + ca - qtdPuxada));
    return {
      mes, ce, dep, mat, pu, es, n1, n2, n3, dt, dm0, dm1, dm2, dm3, c3: cmm3teto, c3raw: c3, c6, c12, ca, rcc,
      reposicaoSC, qtdPuxada, qtdPuxadaDerivada, pxr, risco1, risco2, risco3, score, riscoGeral,
      reposicaoSCRisco,
      pedidosAbertoOriginal, pedidosAbertoRecalc, saldoCC,
      nrm: nrmVal, demandaAjustadaNRM, reposicaoCCNRM, pxc: pxc || 0,
      valorCC: rcc * pu, valorSCRisco: reposicaoSCRisco * pu, valorPuxada: qtdPuxada * pu,
      valorSaldoCC: saldoCC * pu, valorCCNRM: reposicaoCCNRM * pu,
    };
  });
}

// Rollforward autoconsistente (identico a logica Python), por chave Empresa+Regional+Material
// Usado apenas para a linha de "Rupturas" no grafico historico.
function computeRupturas(derivedRows) {
  const groups = new Map();
  for (const r of derivedRows) {
    const k = `${r.ce}|${r.dep}|${r.mat}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  const out = [];
  for (const [, rows] of groups) {
    rows.sort((a,b) => a.mes.localeCompare(b.mes));
    let balance = 0;
    const reposSim = new Array(rows.length).fill(0);
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (!r.riscoGeral) {
        // Mes SEM risco: nao desvia da politica CC -> ancora no saldo REAL.
        // Com a formula 'carta considerada' abaixo, isso reproduz Reposicao_CC exatamente (quando qtdPuxada = derivada).
        balance = r.ca;
      } else if (i === 0) {
        balance = r.ca;
      } else {
        const prev = rows[i-1];
        balance = Math.max(0, balance + reposSim[i-1] - prev.qtdPuxada);
      }
      if (r.riscoGeral) {
        // Mes de risco: simula DESCONSIDERANDO a carta na formula
        reposSim[i] = Math.max(0, r.es + r.dt - (r.n1 + r.n2 + balance));
      } else {
        // Mes sem risco: mesma estrutura de formula, agora CONSIDERANDO a carta (equivale a Reposicao_CC)
        reposSim[i] = Math.max(0, r.es + r.dt - (r.n1 + r.n2 + balance - r.qtdPuxada));
      }
      const saldoCC = r.ca - r.qtdPuxada;
      const saldoSC = balance - r.qtdPuxada;
      out.push({
        mes: r.mes, ce: r.ce, dep: r.dep, mat: r.mat, pu: r.pu,
        // ---- variaveis de entrada (brutas) ----
        es: r.es, n1: r.n1, n2: r.n2, n3: r.n3, dt: r.dt,
        dm0: r.dm0, dm1: r.dm1, dm2: r.dm2, dm3: r.dm3,
        c3raw: r.c3raw, c3teto: r.c3, c6: r.c6, c12: r.c12,
        // ---- puxada ----
        qtdPuxadaDerivada: r.qtdPuxadaDerivada, pxr: r.pxr, qtdPuxada: r.qtdPuxada,
        // ---- risco ----
        risco1: r.risco1, risco2: r.risco2, risco3: r.risco3, score: r.score, riscoGeral: r.riscoGeral,
        // ---- reposicao sem carta (formula base) ----
        reposicaoSCFormula: r.reposicaoSC,
        // ---- rollforward (mes a mes) ----
        pedidoOriginal: r.ca, reposicaoCC: r.rcc,
        pedidoSimulado: balance, reposicaoSC: reposSim[i],
        ancoradoReal: !r.riscoGeral || i === 0,
        // ---- saldos/rupturas ----
        saldoCC, valorSaldoCC: saldoCC * r.pu,
        saldoSC, valorSaldoSC: saldoSC * r.pu,
        // compatibilidade com o grafico Historico (que usa a versao SC_Risco)
        saldo: saldoSC, valor: saldoSC * r.pu,
      });
    }
  }
  return out;
}

/* ============================================================
   MECANISMO A — Simulação pura CC vs SC (SEM métrica de risco)
   Sempre usa a fórmula "sem carta" (nunca desconsidera nem considera
   por causa de risco — risco não entra aqui). Usado na aba "CC vs SC".
   ============================================================ */
function computeSCSimulado(derivedRows) {
  const groups = new Map();
  for (const r of derivedRows) {
    const k = `${r.ce}|${r.dep}|${r.mat}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  const out = [];
  for (const [, rows] of groups) {
    rows.sort((a,b) => a.mes.localeCompare(b.mes));
    let balance = 0;
    const reposSim = new Array(rows.length).fill(0);
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (i === 0) {
        balance = r.ca; // ancora so no 1o mes da serie
      } else {
        const prev = rows[i-1];
        balance = Math.max(0, balance + reposSim[i-1] - prev.qtdPuxada);
      }
      // SEMPRE formula sem carta (nao ha checagem de risco neste mecanismo)
      reposSim[i] = Math.max(0, r.es + r.dt - (r.n1 + r.n2 + balance));
      const saldoCC = r.ca - r.qtdPuxada;
      const saldoSC = balance - r.qtdPuxada;
      out.push({
        mes: r.mes, ce: r.ce, dep: r.dep, mat: r.mat, pu: r.pu,
        n1: r.n1, n2: r.n2, dt: r.dt,
        qtdPuxada: r.qtdPuxada,
        pedidoOriginal: r.ca, reposicaoCC: r.rcc,
        reposicaoSCEstatica: r.reposicaoSC, // Mecanismo B: formula sem carta usando o saldo REAL (ja calculada em computeDerived)
        pedidoSimulado: balance, reposicaoSCSimulada: reposSim[i], // Mecanismo A: rollforward
        nrm: r.nrm, demandaAjustadaNRM: r.demandaAjustadaNRM, reposicaoCCNRM: r.reposicaoCCNRM, // Nova simulacao: CC com demanda ajustada por NRM
        saldoCC, valorSaldoCC: saldoCC * r.pu,
        saldoSC, valorSaldoSC: saldoSC * r.pu,
      });
    }
  }
  return out;
}


/* ============================================================
   MECANISMO D — Simulação com Saldo de Pedidos (Compras em Aberto)
   ajustado por NRM (material já entregue), mantendo a formula estilo CC
   (considera a puxada). Rollforward propaga NRM como saida adicional do saldo.
   ============================================================ */
function computeNRMSimulado(derivedRows) {
  const groups = new Map();
  for (const r of derivedRows) {
    const k = `${r.ce}|${r.dep}|${r.mat}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  const out = [];
  for (const [, rows] of groups) {
    rows.sort((a,b) => a.mes.localeCompare(b.mes));
    let balance = 0;
    const reposD = new Array(rows.length).fill(0);
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (i === 0) {
        balance = r.ca; // ancora no real no 1o mes da serie
      } else {
        const prev = rows[i-1];
        balance = Math.max(0, balance + reposD[i-1] - prev.qtdPuxada - prev.nrm);
      }
      const balanceAjustado = Math.max(0, balance - r.nrm);
      // Formula estilo CC (considera a puxada), usando o saldo simulado JA ajustado pelo NRM do mes.
      // O credito de puxada na formula nunca pode exceder o que existe no saldo simulado (nao da pra descontar
      // mais carta do que havia disponivel) - por isso MAX(0, balanceAjustado - qtdPuxada) em vez da subtracao direta.
      reposD[i] = Math.max(0, r.es + r.dt - (r.n1 + r.n2 + Math.max(0, balanceAjustado - r.qtdPuxada)));
      const saldoCC = r.ca - r.qtdPuxada;
      const saldoD = balanceAjustado - r.qtdPuxada;
      out.push({
        mes: r.mes, ce: r.ce, dep: r.dep, mat: r.mat, pu: r.pu,
        n1: r.n1, n2: r.n2, dt: r.dt,
        qtdPuxada: r.qtdPuxada, nrm: r.nrm,
        pedidoOriginal: r.ca, reposicaoCC: r.rcc,
        pedidoSimulado: balance, pedidoSimuladoAjustado: balanceAjustado, reposicaoD: reposD[i],
        saldoCC, valorSaldoCC: saldoCC * r.pu,
        saldoD, valorSaldoD: saldoD * r.pu,
      });
    }
  }
  return out;
}

/* ============================================================
   ANÁLISE: RISCO DE BAIXO GIRO — foco no MÊS DE REFERÊNCIA (por padrão, o último mês)
   Para cada SKU que gerou Reposição_CC no mês de referência, identifica padrões
   que sugerem que a compra não é justificada pelo consumo médio mais recente (CMM3).
   Excecao: o Giro de Estoque (P6) continua usando CMM12, conforme definido:
   P1) Puxada do mês >> CMM (puxada exagerada, efeito dente de serra)
   P2) Demanda_m3 >> CMM (plano de demanda inflado, MAPE ruim)
   P3) NRM histórico baixo (SKU historicamente pouco entregue/utilizado)
   P4) Puxada histórica muito volátil (coeficiente de variação alto — dente de serra)
   P5) Reposição do mês é outlier frente à própria média histórica do SKU
   Usa somente meses até o mês de referência (sem olhar para o futuro).
   ============================================================ */
function computeGiroRisco(derivedRows, mesReferencia, weights, threshold) {
  const groups = new Map();
  for (const r of derivedRows) {
    const k = `${r.ce}|${r.dep}|${r.mat}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }

  const out = [];
  for (const [, rowsAll] of groups) {
    rowsAll.sort((a,b) => a.mes.localeCompare(b.mes));
    const hist = rowsAll.filter(r => r.mes <= mesReferencia);
    if (hist.length === 0) continue;
    const atual = hist[hist.length - 1];
    if (atual.mes !== mesReferencia || atual.rcc <= 0) continue; // so quem gerou compra no mes de referencia

    // CMM3 = consumo medio mais recente, usado nos padroes de risco (P1, P2) e na Sugestao de Compra.
    // CMM12 = mantido separado, usado APENAS no calculo de Giro de Estoque (P6).
    const cmm3 = Math.max(0, atual.c3);
    const cmm12 = Math.max(0, atual.c12);
    const valorReposicao = atual.rcc * atual.pu;

    // P1: puxada do mes >> CMM3
    const razaoPuxadaCmm = cmm3 > 0 ? atual.qtdPuxada / cmm3 : (atual.qtdPuxada > 0 ? Infinity : 0);
    const riscoPuxada = atual.qtdPuxada > cmm3 * 1.5;

    // P2: alguma das 3 demandas do pipeline (m1, m2, m3) >> CMM3.
    // Cada mes de demanda e avaliado 3 vezes ao longo de sua vida (entra como m3, depois m2, depois m1),
    // entao checar as 3 pega o sinal de demanda inflada o quanto antes, nao so quando ela vira m3.
    const razaoDm1Cmm = cmm3 > 0 ? atual.dm1 / cmm3 : (atual.dm1 > 0 ? Infinity : 0);
    const razaoDm2Cmm = cmm3 > 0 ? atual.dm2 / cmm3 : (atual.dm2 > 0 ? Infinity : 0);
    const razaoDm3Cmm = cmm3 > 0 ? atual.dm3 / cmm3 : (atual.dm3 > 0 ? Infinity : 0);
    const riscoDm1 = atual.dm1 > cmm3 * 1.5;
    const riscoDm2 = atual.dm2 > cmm3 * 1.5;
    const riscoDm3 = atual.dm3 > cmm3 * 1.5;
    const razaoDemandaCmm = Math.max(razaoDm1Cmm, razaoDm2Cmm, razaoDm3Cmm);
    const riscoDemandaM3 = riscoDm1 || riscoDm2 || riscoDm3;

    // P3: NRM historico baixo (soma ate o mes de referencia)
    const nrmHistTotal = hist.reduce((s,r) => s + r.nrm, 0);
    const repHistTotal = hist.reduce((s,r) => s + r.rcc, 0);
    const razaoNrmHist = repHistTotal > 0 ? nrmHistTotal / repHistTotal : 0;
    const riscoNrmBaixo = razaoNrmHist < 0.2;

    // P4: volatilidade da puxada historica (coeficiente de variacao) - efeito dente de serra
    const puxadas = hist.map(r => r.qtdPuxada);
    const mediaPux = puxadas.reduce((a,b) => a+b, 0) / puxadas.length;
    const varPux = puxadas.reduce((s,v) => s + Math.pow(v - mediaPux, 2), 0) / puxadas.length;
    const cvPuxada = mediaPux > 0 ? Math.sqrt(varPux) / mediaPux : 0;
    const riscoVolatilidade = hist.length >= 3 && cvPuxada > 0.8;

    // P5: reposicao do mes e outlier frente a media historica do proprio SKU
    const reposicoes = hist.map(r => r.rcc);
    const mediaRepHist = reposicoes.reduce((a,b) => a+b, 0) / reposicoes.length;
    const riscoOutlierRep = mediaRepHist > 0 && atual.rcc > mediaRepHist * 2;

    // P6: giro de estoque baixo. Giro = 12/Cobertura; Cobertura = (SaldoN1+SaldoN2+SaldoN3)/CMM12 (excecao: usa CMM12, nao CMM3)
    const saldoTotal123 = atual.n1 + atual.n2 + atual.n3;
    let giroEstoque;
    if (saldoTotal123 <= 0) {
      giroEstoque = Infinity; // sem saldo parado nos 3 niveis -> nao ha risco de baixo giro por este criterio
    } else if (cmm12 <= 0) {
      giroEstoque = 0; // ha saldo mas nao ha consumo medio -> giro pessimo
    } else {
      const coberturaMeses = saldoTotal123 / cmm12;
      giroEstoque = 12 / coberturaMeses;
    }
    const riscoGiroBaixo = giroEstoque < 7.5;

    const score = (riscoPuxada?weights.w1:0) + (riscoDemandaM3?weights.w2:0) + (riscoNrmBaixo?weights.w3:0)
      + (riscoVolatilidade?weights.w4:0) + (riscoOutlierRep?weights.w5:0) + (riscoGiroBaixo?weights.w6:0);
    const riscoGiro = score >= threshold - 1e-9 && score > 1e-9;

    // Sugestao de compra para SKUs de risco: mesma logica de meta de cobertura (2x CMM3) do painel
    // Cobertura2xCMM12 - alveja 2 meses de consumo medio MAIS RECENTE, descontando o liquido de Ped.Aberto menos a Puxada.
    // Isso deixa, no minimo, um saldo residual para os clientes puxarem, em vez de seguir a Demanda_Total
    // (que pode estar inflada pelas 3 demandas futuras e pela propria puxada exagerada do mes).
    // Para SKUs com giro baixo (<7,5), o SaldoN3 tambem entra na conta do disponivel liquido.
    // Saldo de pedido disponivel = MAX(0, Ped.Aberto - Puxada). Para SKUs com giro baixo, o SaldoN3
    // (estoque ja em casa, independente do pipeline de compras) e SOMADO a esse saldo - nao subtraido -
    // pois representa material adicional disponivel para atender o cliente.
    const disponivelLiquido = riscoGiroBaixo
      ? Math.max(0, atual.ca - atual.qtdPuxada) + atual.n3
      : Math.max(0, atual.ca - atual.qtdPuxada);
    // A sugestao nunca pode ULTRAPASSAR a Reposicao_CC original - ela existe para propor um valor
    // MENOR (ou igual) quando a compra parece exagerada, nunca para recomendar comprar mais.
    const sugestaoCompraBruta = Math.max(0, 2*cmm3 - disponivelLiquido);
    // Se ja existe SaldoN3 sozinho cobrindo 2x o consumo mais recente, nao ha necessidade de sugerir
    // nenhuma compra - o estoque "em casa" ja atende, mesmo sem contar Ped.Aberto ou Puxada.
    const estoqueN3Suficiente = atual.n3 > 2*cmm3;
    const sugestaoCompra = estoqueN3Suficiente ? 0 : Math.min(atual.rcc, sugestaoCompraBruta);
    const economiaSugestao = atual.rcc - sugestaoCompra;

    out.push({
      ce: atual.ce, dep: atual.dep, mat: atual.mat, pu: atual.pu, mes: atual.mes,
      rcc: atual.rcc, valorReposicao, cmm: cmm3, cmm12, qtdPuxada: atual.qtdPuxada, pedidoOriginal: atual.ca, demandaTotal: atual.dt, dm1: atual.dm1, dm2: atual.dm2, dm3: atual.dm3,
      n1: atual.n1, n2: atual.n2, n3: atual.n3, giroEstoque,
      razaoPuxadaCmm, razaoDemandaCmm, razaoDm1Cmm, razaoDm2Cmm, razaoDm3Cmm, razaoNrmHist, cvPuxada, mediaRepHist, nMesesHist: hist.length,
      riscoPuxada, riscoDemandaM3, riscoDm1, riscoDm2, riscoDm3, riscoNrmBaixo, riscoVolatilidade, riscoOutlierRep, riscoGiroBaixo,
      score, riscoGiro, sugestaoCompra, valorSugestaoCompra: sugestaoCompra*atual.pu, economiaSugestao, valorEconomiaSugestao: economiaSugestao*atual.pu, estoqueN3Suficiente,
    });
  }
  return out.sort((a,b) => b.score - a.score || b.valorReposicao - a.valorReposicao);
}

/* ============================================================
   GRÁFICO CUSTOMIZADO (SVG puro, sem dependência externa)
   2 barras (eixo direito: Ruptura CC / Ruptura SC_Risco) + 2 linhas (eixo esquerdo), com tooltip.
   ============================================================ */
function ComposedHistChart({ data, width = 900, height = 400 }) {
  const [hover, setHover] = useState(null);
  const margin = { top: 20, right: 66, bottom: 34, left: 66 };
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;
  const n = data.length || 1;
  const xStep = n > 1 ? innerW / (n - 1) : 0;
  const xFor = (i) => margin.left + (n > 1 ? i * xStep : innerW / 2);

  const maxLeft = Math.max(1, ...data.map(d => Math.max(d.cc || 0, d.scRisco || 0))) * 1.12;
  const maxRight = Math.max(1, ...data.map(d => Math.max(d.rupturaCC || 0, d.rupturaSCRisco || 0))) * 1.25;
  const yLeft = (v) => margin.top + innerH - (v / maxLeft) * innerH;
  const yRight = (v) => margin.top + innerH - (v / maxRight) * innerH;

  const lineCC = data.map((d,i) => `${i===0?'M':'L'} ${xFor(i)} ${yLeft(d.cc||0)}`).join(' ');
  const lineSC = data.map((d,i) => `${i===0?'M':'L'} ${xFor(i)} ${yLeft(d.scRisco||0)}`).join(' ');

  const barGroupW = n > 1 ? Math.min(40, xStep * 0.6) : 40;
  const barW = barGroupW / 2 - 2;

  const gridVals = [0, 0.25, 0.5, 0.75, 1].map(f => f * maxLeft);

  return (
    <div style={{ position:'relative' }}>
      <svg width="100%" viewBox={`0 0 ${width} ${height}`} style={{ overflow:'visible', fontFamily:T.mono }}>
        {/* gridlines + eixo esquerdo */}
        {gridVals.map((v,i) => (
          <g key={i}>
            <line x1={margin.left} x2={width-margin.right} y1={yLeft(v)} y2={yLeft(v)} stroke={T.border} strokeDasharray="3 3" />
            <text x={margin.left-8} y={yLeft(v)+3} textAnchor="end" fontSize="10.5" fill={T.textFaint}>{fmtMoney(v)}</text>
          </g>
        ))}
        {/* eixo direito (ruptura) */}
        {[0,0.5,1].map((f,i) => (
          <text key={i} x={width-margin.right+8} y={yRight(f*maxRight)+3} textAnchor="start" fontSize="10.5" fill={T.redDim}>{fmtMoney(f*maxRight)}</text>
        ))}
        {/* barras ruptura CC + SC_Risco lado a lado */}
        {data.map((d,i) => {
          const hCC = innerH - (yRight(d.rupturaCC||0) - margin.top);
          const hSC = innerH - (yRight(d.rupturaSCRisco||0) - margin.top);
          return (
            <g key={i}>
              <rect x={xFor(i)-barGroupW/2} y={yRight(d.rupturaCC||0)} width={barW} height={Math.max(0,hCC)}
                fill={T.red} fillOpacity={0.45} rx={2} />
              <rect x={xFor(i)-barGroupW/2+barW+4} y={yRight(d.rupturaSCRisco||0)} width={barW} height={Math.max(0,hSC)}
                fill={T.amber} fillOpacity={0.45} rx={2} />
            </g>
          );
        })}
        {/* linhas */}
        <path d={lineCC} fill="none" stroke={T.textDim} strokeWidth={2} />
        <path d={lineSC} fill="none" stroke={T.teal} strokeWidth={2.5} />
        {data.map((d,i) => (
          <g key={i}>
            <circle cx={xFor(i)} cy={yLeft(d.cc||0)} r={3} fill={T.textDim} />
            <circle cx={xFor(i)} cy={yLeft(d.scRisco||0)} r={3.5} fill={T.teal} />
          </g>
        ))}
        {/* eixo x */}
        {data.map((d,i) => (
          <text key={i} x={xFor(i)} y={height-margin.bottom+18} textAnchor="middle" fontSize="11" fill={T.textFaint}>{d.mesLabel}</text>
        ))}
        {/* faixas de hover invisiveis */}
        {data.map((d,i) => (
          <rect key={i} x={xFor(i)-xStep/2} y={margin.top} width={n>1?xStep:innerW} height={innerH}
            fill="transparent" onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} />
        ))}
        {hover !== null && <line x1={xFor(hover)} x2={xFor(hover)} y1={margin.top} y2={height-margin.bottom} stroke={T.borderLight} strokeDasharray="2 2" />}
      </svg>
      {hover !== null && data[hover] && (
        <div style={{
          position:'absolute', left:`${(xFor(hover)/width)*100}%`, top:8, transform:'translateX(-50%)',
          background:T.panel2, border:`1px solid ${T.borderLight}`, borderRadius:8, padding:'8px 12px',
          fontSize:12, whiteSpace:'nowrap', pointerEvents:'none', boxShadow:'0 8px 20px rgba(0,0,0,0.4)'
        }}>
          <div style={{ fontWeight:700, marginBottom:4 }}>{data[hover].mesLabel}</div>
          <div style={{ color:T.textDim }}>Reposição CC: <b style={{ color:T.text }}>{fmtMoneyFull(data[hover].cc)}</b></div>
          <div style={{ color:T.textDim }}>Reposição SC_Risco: <b style={{ color:T.teal }}>{fmtMoneyFull(data[hover].scRisco)}</b></div>
          <div style={{ color:T.textDim }}>Ruptura CC: <b style={{ color:T.red }}>{fmtMoneyFull(data[hover].rupturaCC)}</b></div>
          <div style={{ color:T.textDim }}>Ruptura SC_Risco: <b style={{ color:T.amber }}>{fmtMoneyFull(data[hover].rupturaSCRisco)}</b></div>
        </div>
      )}
    </div>
  );
}

function WeightSlider({ label, value, onChange, color }) {
  return (
    <div style={{ marginBottom:14 }}>
      <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
        <span style={{ fontFamily:T.sans, fontSize:12.5, color:T.text }}>{label}</span>

function MultiSelect({ label, options, selected, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const toggle = (v) => {
    if (selected.includes(v)) onChange(selected.filter(x => x !== v));
    else onChange([...selected, v]);
  };
  return (
    <div style={{ position:'relative', marginBottom:12 }}>
      <div style={{ fontFamily:T.sans, fontSize:11, color:T.textFaint, marginBottom:5, textTransform:'uppercase', letterSpacing:'0.06em' }}>{label}</div>
      <button onClick={() => setOpen(!open)} style={{
        width:'100%', background:T.panel2, border:`1px solid ${T.border}`, borderRadius:6,
        color: selected.length ? T.text : T.textFaint, fontFamily:T.sans, fontSize:12.5,
        padding:'7px 10px', textAlign:'left', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center'
      }}>
        <span style={{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
          {selected.length ? `${selected.length} selecionado(s)` : placeholder}
        </span>
        <ChevronDown size={13} color={T.textFaint} />
      </button>
      {open && (
        <div style={{
          position:'absolute', top:'100%', left:0, right:0, zIndex:20, marginTop:4,
          background:T.panel2, border:`1px solid ${T.borderLight}`, borderRadius:8,
          maxHeight:220, overflowY:'auto', boxShadow:'0 8px 24px rgba(0,0,0,0.4)'
        }}>
          {selected.length > 0 && (
            <div onClick={() => onChange([])} style={{ padding:'6px 10px', fontSize:11.5, color:T.amber, cursor:'pointer', borderBottom:`1px solid ${T.border}` }}>
              Limpar seleção
            </div>
          )}
          {options.map(o => (
            <label key={o.value} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 10px', fontSize:12.5, color:T.text, cursor:'pointer' }}>
              <input type="checkbox" checked={selected.includes(o.value)} onChange={() => toggle(o.value)} style={{ accentColor:T.teal }} />
              {o.label}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

function StatChip({ label, value, sub, color }) {

// Faixa horizontal mostrando os 3 pesos empilhados (elemento assinatura)
function WeightStrip({ w1, w2, w3, threshold }) {
  const total = w1 + w2 + w3 || 1;
  const segs = [
    { v: w1, color: T.teal, label: 'R1' },
    { v: w2, color: T.amber, label: 'R2' },
    { v: w3, color: T.red, label: 'R3' },
  ];
  return (
    <div>
      <div style={{ display:'flex', height:26, borderRadius:6, overflow:'hidden', border:`1px solid ${T.border}` }}>
        {segs.map((s, i) => (
          <div key={i} style={{
            width: `${(s.v/total)*100}%`, background:s.color, display:'flex', alignItems:'center', justifyContent:'center',
            fontFamily:T.mono, fontSize:10.5, fontWeight:700, color:'#0b0d10', transition:'width 0.25s ease'
          }}>
            {s.v > 0.08 ? s.label : ''}
          </div>
        ))}
      </div>
      <div style={{ position:'relative', height:14, marginTop:2 }}>
        <div style={{
          position:'absolute', left:`${Math.min(threshold,1)*100}%`, top:0, transform:'translateX(-50%)',
          fontFamily:T.mono, fontSize:9.5, color:T.textFaint, whiteSpace:'nowrap'
        }}>▲ limiar {threshold.toFixed(2)}</div>
      </div>
    </div>
  );
}

  const [weights, setWeights] = useState({ w1:0.2, w2:0.3, w3:0.5 });
  const [threshold, setThreshold] = useState(0.2);
  const [activeTab, setActiveTab] = useState('resumo');
  const [showUpload, setShowUpload] = useState(false);

  const [selMes, setSelMes] = useState(null);
  const [selEmpresas, setSelEmpresas] = useState([]);
  const [selRegionais, setSelRegionais] = useState([]);
  const [skuSearch, setSkuSearch] = useState('');
  const [scoreMin, setScoreMin] = useState(0);

  const [chartEmpresas, setChartEmpresas] = useState([]);
  const [chartRegionais, setChartRegionais] = useState([]);

  const [histMeses, setHistMeses] = useState([]);
  const [histEmpresas, setHistEmpresas] = useState([]);
  const [histRegionais, setHistRegionais] = useState([]);
  const [histSkuSearch, setHistSkuSearch] = useState('');

  const [ccscEmpresas, setCcscEmpresas] = useState([]);
  const [ccscRegionais, setCcscRegionais] = useState([]);
  const [ccscMeses, setCcscMeses] = useState([]);
  const [ccscSkuSearch, setCcscSkuSearch] = useState('');

  // pesos e limiar da analise de Risco de Baixo Giro (ajustaveis)
  const [giroWeights, setGiroWeights] = useState({ w1:0.2, w2:0.2, w3:0.15, w4:0.15, w5:0.1, w6:0.2 });
  const [giroThreshold, setGiroThreshold] = useState(0.4);
  const [giroMesRef, setGiroMesRef] = useState(null);
  const [giroEmpresas, setGiroEmpresas] = useState([]);
  const [giroRegionais, setGiroRegionais] = useState([]);
  const [giroSkuSearch, setGiroSkuSearch] = useState('');

  const empresasMap = EMBED.empresas;

  const rawRows = useMemo(() => {
    const rows = [];
    for (const mes of Object.keys(allMonths)) rows.push(...allMonths[mes]);
    return rows;
  }, [allMonths]);

  const derivedRows = useMemo(() => computeDerived(rawRows, weights, threshold), [rawRows, weights, threshold]);

  const availableMonths = useMemo(() => {
    const s = new Set(derivedRows.map(r => r.mes));
    return Array.from(s).sort();
  }, [derivedRows]);

  useEffect(() => {
    if ((!selMes || !availableMonths.includes(selMes)) && availableMonths.length) setSelMes(availableMonths[availableMonths.length - 1]);
  }, [availableMonths, selMes]);

  const availableEmpresas = useMemo(() => {
    const s = new Set(derivedRows.map(r => r.ce));
    return Array.from(s).sort((a,b)=>a-b).map(ce => ({ value: ce, label: empresasMap[ce] || ce }));
  }, [derivedRows]);

  const availableRegionais = useMemo(() => {
    const s = new Set(derivedRows.filter(r => selEmpresas.length===0 || selEmpresas.includes(r.ce)).map(r => r.dep));
    return Array.from(s).sort((a,b)=>a-b).map(d => ({ value: d, label: `Regional ${d}` }));
  }, [derivedRows, selEmpresas]);

  const chartAvailableRegionais = useMemo(() => {
    const s = new Set(derivedRows.filter(r => chartEmpresas.length===0 || chartEmpresas.includes(r.ce)).map(r => r.dep));
    return Array.from(s).sort((a,b)=>a-b).map(d => ({ value: d, label: `Regional ${d}` }));
  }, [derivedRows, chartEmpresas]);

  const histAvailableRegionais = useMemo(() => {
    const s = new Set(derivedRows.filter(r => histEmpresas.length===0 || histEmpresas.includes(r.ce)).map(r => r.dep));
    return Array.from(s).sort((a,b)=>a-b).map(d => ({ value: d, label: `Regional ${d}` }));
  }, [derivedRows, histEmpresas]);

  const rowsResumo = useMemo(() => derivedRows.filter(r =>
    r.mes === selMes &&
    (selEmpresas.length===0 || selEmpresas.includes(r.ce)) &&
    (selRegionais.length===0 || selRegionais.includes(r.dep))
  ), [derivedRows, selMes, selEmpresas, selRegionais]);

  const resumoAgg = useMemo(() => {
    const map = new Map();
    for (const r of rowsResumo) {
      const key = r.ce;
      if (!map.has(key)) map.set(key, { ce:r.ce, valorCC:0, valorSCRisco:0, c12:0, dm3:0, qtdSkus:0 });
      const e = map.get(key);
      e.valorCC += r.valorCC; e.valorSCRisco += r.valorSCRisco; e.c12 += r.c12; e.dm3 += r.dm3; e.qtdSkus += 1;
    }
    return Array.from(map.values()).sort((a,b) => b.valorCC - a.valorCC);
  }, [rowsResumo]);

  const totCC = resumoAgg.reduce((s,r)=>s+r.valorCC,0);
  const totSCRisco = resumoAgg.reduce((s,r)=>s+r.valorSCRisco,0);

  const rowsDetalhe = useMemo(() => {
    const q = skuSearch.trim().toLowerCase();
    return derivedRows.filter(r =>
      r.mes === selMes &&
      (selEmpresas.length===0 || selEmpresas.includes(r.ce)) &&
      (selRegionais.length===0 || selRegionais.includes(r.dep)) &&
      r.score >= scoreMin &&
      (q === '' || String(r.mat).includes(q) || (materiaisMap0[r.mat]||'').toLowerCase().includes(q))
    ).sort((a,b) => b.score - a.score);
  }, [derivedRows, selMes, selEmpresas, selRegionais, scoreMin, skuSearch, materiaisMap0]);

  const rowsChartFiltered = useMemo(() => derivedRows.filter(r =>
    (chartEmpresas.length===0 || chartEmpresas.includes(r.ce)) &&
    (chartRegionais.length===0 || chartRegionais.includes(r.dep))
  ), [derivedRows, chartEmpresas, chartRegionais]);

  const rupturasAll = useMemo(() => computeRupturas(derivedRows), [derivedRows]);

  const rupturasFiltered = useMemo(() => {
    return rupturasAll.filter(r =>
      (chartEmpresas.length===0 || chartEmpresas.includes(r.ce)) &&
      (chartRegionais.length===0 || chartRegionais.includes(r.dep))
    );
  }, [rupturasAll, chartEmpresas, chartRegionais]);

  const rupturasHistFiltered = useMemo(() => {
    const q = histSkuSearch.trim().toLowerCase();
    return rupturasAll.filter(r =>
      (histMeses.length===0 || histMeses.includes(r.mes)) &&
      (histEmpresas.length===0 || histEmpresas.includes(r.ce)) &&
      (histRegionais.length===0 || histRegionais.includes(r.dep)) &&
      (q === '' || String(r.mat).includes(q) || (materiaisMap0[r.mat]||'').toLowerCase().includes(q))
    ).sort((a,b) => b.mes.localeCompare(a.mes) || a.ce - b.ce || a.dep - b.dep || a.mat - b.mat);
  }, [rupturasAll, histMeses, histEmpresas, histRegionais, histSkuSearch, materiaisMap0]);

  // ---- aba CC vs SC (sem risco) ----
  const ccscAll = useMemo(() => {
    const base = computeSCSimulado(derivedRows);
    const nrmSim = computeNRMSimulado(derivedRows);
    const nrmMap = new Map(nrmSim.map(r => [`${r.mes}|${r.ce}|${r.dep}|${r.mat}`, r]));
    return base.map(r => {
      const d = nrmMap.get(`${r.mes}|${r.ce}|${r.dep}|${r.mat}`);
      return d ? { ...r, pedidoSimuladoD: d.pedidoSimuladoAjustado, reposicaoD: d.reposicaoD, saldoD: d.saldoD, valorSaldoD: d.valorSaldoD } : r;
    });
  }, [derivedRows]);

  const ccscAvailableRegionais = useMemo(() => {
    const s = new Set(derivedRows.filter(r => ccscEmpresas.length===0 || ccscEmpresas.includes(r.ce)).map(r => r.dep));
    return Array.from(s).sort((a,b)=>a-b).map(d => ({ value: d, label: `Regional ${d}` }));
  }, [derivedRows, ccscEmpresas]);

  const ccscFiltered = useMemo(() => {
    return ccscAll.filter(r =>
      (ccscEmpresas.length===0 || ccscEmpresas.includes(r.ce)) &&
      (ccscRegionais.length===0 || ccscRegionais.includes(r.dep))
    );
  }, [ccscAll, ccscEmpresas, ccscRegionais]);

  const ccscTableFiltered = useMemo(() => {
    const q = ccscSkuSearch.trim().toLowerCase();
    return ccscFiltered.filter(r =>
      (ccscMeses.length===0 || ccscMeses.includes(r.mes)) &&
      (q === '' || String(r.mat).includes(q) || (materiaisMap0[r.mat]||'').toLowerCase().includes(q))
    ).sort((a,b) => b.mes.localeCompare(a.mes) || a.ce - b.ce || a.dep - b.dep || a.mat - b.mat);
  }, [ccscFiltered, ccscMeses, ccscSkuSearch, materiaisMap0]);

  const ccscChartData = useMemo(() => {
    const map = new Map();
    for (const mes of availableMonths) map.set(mes, { mes, mesLabel: mesLabel(mes), cc:0, scEstatico:0, scSimulado:0, ccNRM:0, reposD:0, rupturaCC:0, rupturaSC:0, rupturaD:0 });
    for (const r of ccscFiltered) {
      const e = map.get(r.mes); if (!e) continue;
      e.cc += r.reposicaoCC * r.pu;
      e.scEstatico += r.reposicaoSCEstatica * r.pu;
      e.scSimulado += r.reposicaoSCSimulada * r.pu;
      e.ccNRM += r.reposicaoCCNRM * r.pu;
      if (r.reposicaoD !== undefined) e.reposD += r.reposicaoD * r.pu;
      if (r.saldoCC < 0) e.rupturaCC += -r.valorSaldoCC;
      if (r.saldoSC < 0) e.rupturaSC += -r.valorSaldoSC;
      if (r.saldoD !== undefined && r.saldoD < 0) e.rupturaD += -r.valorSaldoD;
    }
    return Array.from(map.values());
  }, [availableMonths, ccscFiltered]);

  const ccscTotais = useMemo(() => {
    let cc=0, scEst=0, scSim=0, ccNRM=0, reposD=0, rupCC=0, rupSC=0, nRupSC=0, rupD=0, nRupD=0;
    for (const r of ccscFiltered) {
      cc += r.reposicaoCC * r.pu;
      scEst += r.reposicaoSCEstatica * r.pu;
      scSim += r.reposicaoSCSimulada * r.pu;
      ccNRM += r.reposicaoCCNRM * r.pu;
      if (r.reposicaoD !== undefined) reposD += r.reposicaoD * r.pu;
      if (r.saldoCC < 0) rupCC += -r.valorSaldoCC;
      if (r.saldoSC < 0) { rupSC += -r.valorSaldoSC; nRupSC++; }
      if (r.saldoD !== undefined && r.saldoD < 0) { rupD += -r.valorSaldoD; nRupD++; }
    }
    return { cc, scEst, scSim, ccNRM, reposD, rupCC, rupSC, nRupSC, rupD, nRupD, total: ccscFiltered.length };
  }, [ccscFiltered]);

  // ---- aba Risco de Baixo Giro ----
  useEffect(() => {
    if ((!giroMesRef || !availableMonths.includes(giroMesRef)) && availableMonths.length) setGiroMesRef(availableMonths[availableMonths.length - 1]);
  }, [availableMonths, giroMesRef]);

  const giroAll = useMemo(() => {
    if (!giroMesRef) return [];
    return computeGiroRisco(derivedRows, giroMesRef, giroWeights, giroThreshold);
  }, [derivedRows, giroMesRef, giroWeights, giroThreshold]);

  const giroAvailableRegionais = useMemo(() => {
    const s = new Set(derivedRows.filter(r => giroEmpresas.length===0 || giroEmpresas.includes(r.ce)).map(r => r.dep));
    return Array.from(s).sort((a,b)=>a-b).map(d => ({ value: d, label: `Regional ${d}` }));
  }, [derivedRows, giroEmpresas]);

  const giroFiltered = useMemo(() => {
    const q = giroSkuSearch.trim().toLowerCase();
    return giroAll.filter(r =>
      (giroEmpresas.length===0 || giroEmpresas.includes(r.ce)) &&
      (giroRegionais.length===0 || giroRegionais.includes(r.dep)) &&
      (q === '' || String(r.mat).includes(q) || (materiaisMap0[r.mat]||'').toLowerCase().includes(q))
    );
  }, [giroAll, giroEmpresas, giroRegionais, giroSkuSearch, materiaisMap0]);

  const giroRiscoRows = useMemo(() => giroFiltered.filter(r => r.riscoGiro), [giroFiltered]);

  const giroTotais = useMemo(() => {
    let valorRisco = 0, valorTotal = 0, valorSugestaoTotal = 0, valorEconomiaTotal = 0;
    for (const r of giroFiltered) valorTotal += r.valorReposicao;
    for (const r of giroRiscoRows) { valorRisco += r.valorReposicao; valorSugestaoTotal += r.valorSugestaoCompra; valorEconomiaTotal += r.valorEconomiaSugestao; }
    return { valorRisco, valorTotal, valorSugestaoTotal, valorEconomiaTotal, nRisco: giroRiscoRows.length, total: giroFiltered.length };
  }, [giroFiltered, giroRiscoRows]);

  const giroResumoPorEmpresa = useMemo(() => {
    const map = new Map();
    for (const r of giroFiltered) {
      if (!map.has(r.ce)) map.set(r.ce, { ce: r.ce, valorCmm12: 0, valorDemandaTotal: 0, valorSaldoN3: 0, valorReposicaoCC: 0, valorReposicaoSugerida: 0, nSkus: 0, nRisco: 0 });
      const e = map.get(r.ce);
      e.valorCmm12 += r.cmm12 * r.pu;
      e.valorDemandaTotal += r.demandaTotal * r.pu;
      e.valorSaldoN3 += r.n3 * r.pu;
      e.valorReposicaoCC += r.valorReposicao;
      e.valorReposicaoSugerida += r.riscoGiro ? r.valorSugestaoCompra : r.valorReposicao;
      e.nSkus += 1;
      if (r.riscoGiro) e.nRisco += 1;
    }
    const linhas = Array.from(map.values())
      .map(e => ({ ...e, valorEconomiaProjetada: e.valorReposicaoCC - e.valorReposicaoSugerida }))
      .sort((a,b) => b.valorReposicaoCC - a.valorReposicaoCC);
    const totais = linhas.reduce((acc, e) => ({
      ce: null,
      valorCmm12: acc.valorCmm12 + e.valorCmm12,
      valorDemandaTotal: acc.valorDemandaTotal + e.valorDemandaTotal,
      valorSaldoN3: acc.valorSaldoN3 + e.valorSaldoN3,
      valorReposicaoCC: acc.valorReposicaoCC + e.valorReposicaoCC,
      valorReposicaoSugerida: acc.valorReposicaoSugerida + e.valorReposicaoSugerida,
      valorEconomiaProjetada: acc.valorEconomiaProjetada + e.valorEconomiaProjetada,
      nSkus: acc.nSkus + e.nSkus,
      nRisco: acc.nRisco + e.nRisco,
    }), { valorCmm12:0, valorDemandaTotal:0, valorSaldoN3:0, valorReposicaoCC:0, valorReposicaoSugerida:0, valorEconomiaProjetada:0, nSkus:0, nRisco:0 });
    return { linhas, totais };
  }, [giroFiltered]);


  const chartData = useMemo(() => {
    const map = new Map();
    for (const mes of availableMonths) map.set(mes, { mes, mesLabel: mesLabel(mes), cc:0, scRisco:0, rupturaCC:0, rupturaSCRisco:0 });
    for (const r of rowsChartFiltered) {
      const e = map.get(r.mes); if (!e) continue;
      e.cc += r.valorCC; e.scRisco += r.valorSCRisco;
      if (r.saldoCC < 0) e.rupturaCC += -r.valorSaldoCC;
    }
    for (const r of rupturasFiltered) { if (r.saldo < 0) { const e = map.get(r.mes); if (e) e.rupturaSCRisco += -r.valor; } }
    return Array.from(map.values());
  }, [availableMonths, rowsChartFiltered, rupturasFiltered]);

  const handleFile = useCallback((file) => {
    if (!pendingMonth || !/^\d{4}-\d{2}$/.test(pendingMonth)) {
      setUploadMsg({ type:'error', text:'Informe o mês de referência no formato AAAA-MM antes de enviar o arquivo.' });
      return;
    }
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type:'array' });
        const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('visão') || n.toLowerCase().includes('visao')) || wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const rows2d = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
        const { rows, materiais } = parseUploadedSheet(rows2d, pendingMonth);
        if (rows.length === 0) throw new Error('Nenhuma linha válida encontrada no arquivo.');
        setAllMonths(prev => ({ ...prev, [pendingMonth]: rows }));
        setMateriaisMap0(prev => ({ ...prev, ...materiais }));
        setUploadMsg({ type:'success', text:`Mês ${mesLabel(pendingMonth)} carregado: ${rows.length} linhas. Não esqueça de baixar o index.html atualizado.` });
        setSelMes(pendingMonth);
        setPendingMonth('');
        if (fileInputRef.current) fileInputRef.current.value = '';
      } catch (err) {
        setUploadMsg({ type:'error', text: err.message || 'Erro ao processar o arquivo.' });
      }
    };
    reader.readAsArrayBuffer(file);
  }, [pendingMonth]);

  const removeUploadedMonth = (mes) => {
    if (!window.confirm(`Remover o mês ${mesLabel(mes)} da base? Isso só terá efeito permanente se você baixar o index.html atualizado depois.`)) return;
    setAllMonths(prev => { const c = { ...prev }; delete c[mes]; return c; });
    if (selMes === mes) setSelMes(null);
  };

  const uploadedMonthsList = Object.keys(allMonths).sort();

  // ---- baixar backup .json (leve, so dados) ----
  const handleBackupDownload = () => {
    const payload = { geradoEm: new Date().toISOString(), tipo: 'backup_painel_reposicao_risco', cols: COLS, empresas: EMBED.empresas, materiais: materiaisMap0, months: allMonths };
    const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `backup_reposicao_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const handleRestoreBackup = (file) => {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const payload = JSON.parse(evt.target.result);
        if (payload.tipo !== 'backup_painel_reposicao_risco') throw new Error('Arquivo não é um backup válido deste painel.');
        setAllMonths(payload.months || {});
        setMateriaisMap0(payload.materiais || {});
        setUploadMsg({ type:'success', text:`Backup restaurado: ${Object.keys(payload.months||{}).length} mês(es) recuperados.` });
      } catch (err) {
        setUploadMsg({ type:'error', text: err.message || 'Erro ao ler o arquivo de backup.' });
      }
    };
    reader.readAsText(file);
  };

  // ---- baixar index.html atualizado (embute o estado atual como novo app-data) ----
  const handleDownloadIndex = () => {
    const newPayload = { cols: COLS, empresas: EMBED.empresas, materiais: materiaisMap0, months: allMonths };
    const dataScript = document.getElementById('app-data');
    const originalContent = dataScript.textContent;
    dataScript.textContent = JSON.stringify(newPayload);
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    dataScript.textContent = originalContent; // restaura o estado visual atual da pagina
    const blob = new Blob([html], { type:'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  return (
    <div style={{ minHeight:'100%', background:T.bg, color:T.text, fontFamily:T.sans, padding:'20px 22px', boxSizing:'border-box' }}>
      {/* HEADER */}
      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:20, flexWrap:'wrap', gap:10 }}>
        <div>
          <div style={{ fontSize:10.5, letterSpacing:'0.18em', color:T.amber, textTransform:'uppercase', fontWeight:700, marginBottom:4 }}>
            Reposição · Motor de Risco
          </div>
          <h1 style={{ margin:0, fontSize:22, fontWeight:800, letterSpacing:'-0.01em' }}>
            Painel Mensal de Reposição &amp; Risco de Ruptura
          </h1>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ fontFamily:T.mono, fontSize:11.5, color:T.textFaint, textAlign:'right' }}>
            {availableMonths.length} meses na base
          </div>
          <button onClick={() => setShowUpload(true)} title="Atualizar base mensal" style={{
            display:'flex', alignItems:'center', gap:6, background:'transparent', border:`1px solid ${T.border}`,
            borderRadius:6, padding:'7px 11px', color:T.textFaint, fontFamily:T.sans, fontSize:11.5, cursor:'pointer'
          }}>
            <Upload size={12} /> Atualizar dados
          </button>
        </div>
      </div>

      <div style={{ display:'flex', alignItems:'flex-start', gap:8, fontSize:11.5, color:T.textDim, background:T.panel2, border:`1px solid ${T.border}`, borderRadius:8, padding:'9px 12px', marginBottom:18, lineHeight:1.5 }}>
        <Info size={13} color={T.amber} style={{ flexShrink:0, marginTop:1 }} />
        Esta é uma página estática (sem servidor). Alterações (novos meses, remoções) só ficam visíveis para outras pessoas depois que você clicar em <b>"Baixar index.html"</b> e substituir o arquivo publicado no seu repositório/GitHub Pages.
      </div>

      {showUpload && (
        <UploadModal
          pendingMonth={pendingMonth} setPendingMonth={setPendingMonth}
          fileInputRef={fileInputRef} handleFile={handleFile}
          uploadMsg={uploadMsg} uploadedMonthsList={uploadedMonthsList}
          removeUploadedMonth={removeUploadedMonth} onClose={() => { setShowUpload(false); setUploadMsg(null); }}
          handleBackupDownload={handleBackupDownload} handleRestoreBackup={handleRestoreBackup} backupFileInputRef={backupFileInputRef}
          handleDownloadIndex={handleDownloadIndex}
        />
      )}

      <div style={{ display:'grid', gridTemplateColumns: activeTab==='giro' ? '1fr' : '280px 1fr', gap:18, alignItems:'start' }}>
        {activeTab !== 'giro' && (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          <Card style={{ padding:16 }}>
            <SectionLabel icon={Sliders}>Métrica de risco</SectionLabel>
            <WeightStrip w1={weights.w1} w2={weights.w2} w3={weights.w3} threshold={threshold} />
            <div style={{ height:12 }} />
            <WeightSlider label="R1 · Demanda_m0 > CMM3 (tol. 10%)" value={weights.w1} color={T.teal} onChange={v => setWeights(w => ({ ...w, w1:v }))} />
            <WeightSlider label="R2 · Puxada > Demanda_m0 (sem tol.)" value={weights.w2} color={T.amber} onChange={v => setWeights(w => ({ ...w, w2:v }))} />
            <WeightSlider label="R3 · Puxada > CMM3 (tol. 10%)" value={weights.w3} color={T.red} onChange={v => setWeights(w => ({ ...w, w3:v }))} />
            <div style={{ borderTop:`1px solid ${T.border}`, paddingTop:12, marginTop:4 }}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
                <span style={{ fontSize:12.5 }}>Limiar de risco (score ≥)</span>
                <span style={{ fontFamily:T.mono, fontSize:12.5, color:T.amber, fontWeight:700 }}>{threshold.toFixed(2)}</span>
              </div>
              <input type="range" min={0} max={1} step={0.05} value={threshold} onChange={e => setThreshold(parseFloat(e.target.value))} style={{ width:'100%', accentColor:T.amber }} />
              <div style={{ fontSize:10.5, color:T.textFaint, marginTop:4, lineHeight:1.4 }}>SKU/mês é "risco" quando o score ponderado ≥ limiar. Score = soma dos pesos das regras ativas.</div>
            </div>
          </Card>

          <Card style={{ padding:16 }}>
            <SectionLabel>Filtros — Resumo &amp; Detalhe</SectionLabel>

   ============================================================ */
function ResumoTab({ selMes, resumoAgg, totCC, totSCRisco, empresasMap, rowsResumo }) {
  const economiaTotal = totCC > 0 ? (1 - totSCRisco/totCC) * 100 : 0;
  const nRisco = rowsResumo.filter(r => r.riscoGeral).length;
  const pctRisco = rowsResumo.length ? (nRisco/rowsResumo.length*100) : 0;

  return (
    <div>
      <div style={{ display:'flex', gap:12, marginBottom:18, flexWrap:'wrap' }}>
        <StatChip label={`Reposição CC · ${mesLabel(selMes)}`} value={fmtMoney(totCC)} color={T.text} />
        <StatChip label={`Reposição SC_Risco · ${mesLabel(selMes)}`} value={fmtMoney(totSCRisco)} color={T.teal} />
        <StatChip label="Economia projetada" value={`${economiaTotal.toFixed(1)}%`} sub={fmtMoney(totCC-totSCRisco)} color={economiaTotal>=0 ? T.green : T.red} />
        <StatChip label="SKUs em risco" value={`${pctRisco.toFixed(0)}%`} sub={`${nRisco} de ${rowsResumo.length}`} color={T.amber} />
      </div>

      <Card style={{ padding:16 }}>
        <SectionLabel>Reposição por Empresa — {mesLabel(selMes)}</SectionLabel>
        {resumoAgg.length === 0 ? (
          <div style={{ color:T.textFaint, fontSize:12.5, padding:'20px 0' }}>Sem dados para os filtros selecionados.</div>
        ) : (
          <div style={{ maxHeight:460, overflowY:'auto' }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12.5 }}>
              <thead>
                <tr style={{ position:'sticky', top:0, background:T.panel }}>
                  <th style={thStyle}>Empresa</th>
                  <th style={{...thStyle, textAlign:'right'}}>SKUs</th>
                  <th style={{...thStyle, textAlign:'right'}}>CMM12</th>
                  <th style={{...thStyle, textAlign:'right'}}>Demanda_m3</th>
                  <th style={{...thStyle, textAlign:'right'}}>Reposição CC (R$)</th>
                  <th style={{...thStyle, textAlign:'right'}}>Reposição SC_Risco (R$)</th>
                  <th style={{...thStyle, textAlign:'right'}}>Economia Projetada</th>
                </tr>
              </thead>
              <tbody>
                {resumoAgg.map((r,i) => {
                  const econ = r.valorCC > 0 ? (1 - r.valorSCRisco/r.valorCC) * 100 : 0;
                  return (
                    <tr key={i} style={{ borderTop:`1px solid ${T.border}` }}>
                      <td style={tdStyle}>{empresasMap[r.ce] || r.ce}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{r.qtdSkus}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{fmtNum(r.c12,1)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, color:T.textDim}}>{fmtNum(r.dm3,1)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:600}}>{fmtMoneyFull(r.valorCC)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:600, color:T.teal}}>{fmtMoneyFull(r.valorSCRisco)}</td>
                      <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:700, color: econ>=0 ? T.green : T.red}}>{econ.toFixed(1)}%</td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{ borderTop:`2px solid ${T.borderLight}` }}>
                  <td style={{...tdStyle, fontWeight:700}} colSpan={4}>TOTAL</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:800}}>{fmtMoneyFull(totCC)}</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:800, color:T.teal}}>{fmtMoneyFull(totSCRisco)}</td>
                  <td style={{...tdStyle, textAlign:'right', fontFamily:T.mono, fontWeight:800, color: economiaTotal>=0 ? T.green : T.red}}>{economiaTotal.toFixed(1)}%</td>
                </tr>
              </tfoot>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

}

function HistoricoTab({ chartData, availableEmpresas, availableRegionais, chartEmpresas, setChartEmpresas, chartRegionais, setChartRegionais }) {
  return (
    <Card style={{ padding:18 }}>
      <div style={{ display:'flex', gap:16, marginBottom:18, flexWrap:'wrap', alignItems:'flex-end' }}>
        <div style={{ width:220 }}>
          <MultiSelect label="Empresa" options={availableEmpresas} selected={chartEmpresas} onChange={setChartEmpresas} placeholder="Todas as empresas" />
        </div>
        <div style={{ width:220 }}>
          <MultiSelect label="Regional" options={availableRegionais} selected={chartRegionais} onChange={setChartRegionais} placeholder="Todas as regionais" />
        </div>
        <div style={{ display:'flex', gap:14, marginBottom:12, fontSize:11.5, color:T.textDim, flexWrap:'wrap' }}>
          <LegendDot color={T.textDim} label="Reposição CC" />
          <LegendDot color={T.teal} label="Reposição SC_Risco" />
          <LegendDot color={T.red} label="Ruptura CC (R$)" />
          <LegendDot color={T.amber} label="Ruptura SC_Risco (R$)" />
        </div>
      </div>

      <ComposedHistChart data={chartData} width={900} height={420} />
      <div style={{ fontSize:11, color:T.textDim, marginTop:14, lineHeight:1.6, background:T.panel2, border:`1px solid ${T.border}`, borderRadius:8, padding:'10px 12px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:6, color:T.textFaint, fontSize:10.5, textTransform:'uppercase', letterSpacing:'0.06em', fontWeight:700 }}>
          <Info size={12} /> Como cada Ruptura é calculada
        </div>
        <b>Ruptura CC</b> = valor negativo de [Compras em Aberto REAL(m)] − [Qtd Carta(m)], mês a mês, sem simulação — reflete o que de fato aconteceu.<br/>
        <b>Ruptura SC_Risco</b> = simula o pipeline de Compras em Aberto mês a mês (rollforward) por SKU, ancorado no valor real do primeiro mês. A cada passo: <b>Saldo(m) = MÁX(0, Saldo(m−1) + Reposição_simulada(m−1) − Puxada real(m−1))</b>, nunca negativo. Em meses SEM risco, o saldo ancora no valor REAL (não desvia da política CC) e a fórmula, considerando a carta, reproduz a Reposição_CC exatamente. Em meses de <b>Risco</b>, o saldo propaga da simulação anterior e a fórmula ignora a carta. A Ruptura é o valor negativo de Saldo(m) − Puxada real(m). Com pesos/limiar zerados, a simulação converge para o comportamento real (CC).
      </div>
    </Card>
  );
}

function LegendDot({ color, label }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:5 }}>
      <div style={{ width:9, height:9, borderRadius:2, background:color }} />
      {label}
    </div>
  );
}

/* ============================================================
   ABA: CC vs SC (sem risco) — Mecanismo B (economia pontual) + Mecanismo A (risco real simulado)
   ============================================================ */
function CCvsSCTab({ chartData, totais, tableRows, empresasMap, materiaisMap, availableMonths, availableEmpresas, availableRegionais,
  ccscEmpresas, setCcscEmpresas, ccscRegionais, setCcscRegionais, ccscMeses, setCcscMeses, ccscSkuSearch, setCcscSkuSearch }) {

  const handleExport = () => {
    const data = tableRows.map(r => ({
      'Mês': mesLabel(r.mes),
      'Empresa': empresasMap[r.ce] || r.ce,
      'Regional': r.dep,
      'SKU': r.mat,
      'Descrição': materiaisMap[r.mat] || '',
      'Saldo N1': r.n1,
      'Saldo N2': r.n2,
      'Demanda Total': r.dt,
      'Qtd Carta': r.qtdPuxada,
      'Ped. Original': r.pedidoOriginal,
      'Reposição CC': r.reposicaoCC,
      'Ped. Simulado SC': r.pedidoSimulado,
      'Reposição SC (simulado)': r.reposicaoSCSimulada,
      'NRM': r.nrm,
      'Ped. Simulado (NRM)': r.pedidoSimuladoD,
      'Reposição simulada NRM': r.reposicaoD,
      'Ruptura CC (qtd)': r.saldoCC,
      'Ruptura CC (R$)': r.valorSaldoCC,
      'Ruptura SC Sim. (qtd)': r.saldoSC,
      'Ruptura SC Sim. (R$)': r.valorSaldoSC,
      'Ruptura NRM sim. (qtd)': r.saldoD,
      'Ruptura NRM sim. (R$)': r.valorSaldoD,
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'CC vs SC');
    XLSX.writeFile(wb, `CC_vs_SC_sem_risco.xlsx`);
  };

  const economiaPct = totais.cc > 0 ? (1 - totais.scEst/totais.cc)*100 : 0;

  return (
    <div>
      <div style={{ display:'flex', gap:12, marginBottom:18, flexWrap:'wrap' }}>
        <StatChip label="Reposição CC (total)" value={fmtMoney(totais.cc)} color={T.text} />
        <StatChip label="Reposição SC Estática (B)" value={fmtMoney(totais.scEst)} sub={`${economiaPct.toFixed(1)}% menos que CC`} color={T.green} />
        <StatChip label="Reposição SC Simulada (A)" value={fmtMoney(totais.scSim)} color={T.teal} />
        <StatChip label="Ruptura CC" value={fmtMoney(totais.rupCC)} color={T.red} />
        <StatChip label="Ruptura SC Simulada" value={fmtMoney(totais.rupSC)} sub={`${totais.nRupSC} de ${totais.total} linhas`} color={T.amber} />
        <StatChip label="Reposição CC (NRM ajustada, C)" value={fmtMoney(totais.ccNRM)} color={T.amber} />
        <StatChip label="Reposição D (simulada, NRM)" value={fmtMoney(totais.reposD)} color={T.amber} />
        <StatChip label="Ruptura D" value={fmtMoney(totais.rupD)} sub={`${totais.nRupD} de ${totais.total} linhas`} color={T.red} />
      </div>

      <Card style={{ padding:16, marginBottom:16 }}>
        <SectionLabel icon={Info}>B — Economia Potencial Pontual (comparação estática, sem simulação)</SectionLabel>
        <div style={{ fontSize:11.5, color:T.textDim, lineHeight:1.5, marginBottom:12 }}>
          Recalcula a Reposição SC mês a mês usando sempre o saldo <b>real</b> — não herda efeito de meses anteriores. Mostra quanto se compraria a menos <i>naquele mês isolado</i>, sem indicar risco de ruptura futura.
        </div>
        <MiniLineChart data={chartData} width={900} height={220} />
      </Card>

      <Card style={{ padding:16, marginBottom:16 }}>
        <SectionLabel icon={AlertTriangle}>A — Risco Real de Ruptura ao Longo do Tempo (simulação rollforward)</SectionLabel>
        <div style={{ fontSize:11.5, color:T.textDim, lineHeight:1.5, marginBottom:12 }}>
          Simula o pipeline de Compras em Aberto mês a mês, <b>sempre</b> com a fórmula sem carta (sem checagem de risco): Saldo Simulado(m) = MÁX(0, Saldo Simulado(m−1) + Reposição_SC(m−1) − Puxada(m−1)), ancorado no real só no 1º mês de cada SKU. Mostra o efeito acumulado de comprar menos ao longo do tempo.
        </div>
        <ComposedCCSCChart data={chartData} width={900} height={380} />
      </Card>

      <Card style={{ padding:16, marginBottom:16 }}>
        <SectionLabel icon={Info}>C — Reposição CC recalculada com Demanda ajustada por NRM</SectionLabel>
        <div style={{ fontSize:11.5, color:T.textDim, lineHeight:1.5, marginBottom:12 }}>
          Mesma fórmula da Reposição CC original, mas descontando da Demanda Total o que já foi <b>entregue</b> naquele mês (NRM): Reposição_CC(NRM) = MÁX(0, ES + (Demanda Total − NRM) − (N1+N2+Ped.Aberto−Puxada)). Sem simulação — comparação mês a mês, direto com o dado real.
        </div>
        <MiniLineChart data={chartData} width={900} height={220} lineAKey="cc" lineBKey="ccNRM" lineALabel="Reposição CC" lineBLabel="Reposição CC (NRM ajustada)" lineBColor={T.amber} />
      </Card>

      <Card style={{ padding:16, marginBottom:16 }}>
        <SectionLabel icon={AlertTriangle}>D — Simulação com Saldo de Pedidos ajustado por NRM (rollforward)</SectionLabel>
        <div style={{ fontSize:11.5, color:T.textDim, lineHeight:1.5, marginBottom:12 }}>
          Mesma lógica de rollforward do bloco A, mas agora o saldo simulado também desconta o NRM (material já entregue) a cada mês, além da puxada — e a fórmula volta a considerar a puxada (estilo CC). Saldo_D(m) = MÁX(0, Simulado(m−1) + Reposição_D(m−1) − Puxada(m−1) − NRM(m−1)); Reposição_D(m) = MÁX(0, ES+DT−(N1+N2+Saldo_D(m)−Puxada(m))).
        </div>
        <ComposedCCSCChart data={chartData} width={900} height={380} lineBKey="reposD" rupturaBKey="rupturaD" lineBLabel="Reposição D (simulada)" rupturaBLabel="Ruptura D" lineBColor={T.amber} rupturaBColor={T.amber} />
